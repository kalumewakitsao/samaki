<!doctype html>
<html lang="en-KE" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <title>Samaki Express | Fingerlings, feeds and fish farm support in Kenya</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Fingerlings, hatchery feeds, water testing kits, aeration equipment and hands-on farm support for fish farmers. Based in Nairobi. Request a quote."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#071417" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved or system theme before first paint, so no page flashes the wrong theme.
      (function () {
        var d = document.documentElement,
          pref = null;
        try {
          pref = localStorage.getItem('samaki-theme');
        } catch (e) {}
        var dark = pref
          ? pref === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        d.setAttribute('data-theme', dark ? 'dark' : 'light');
        d.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <link
      rel="preload"
      href="fonts/bricolage-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/inter-latin-wght.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 1rem; font-family: system-ui, sans-serif">
        Call us on 0704 944 034 or email samakiexpresske@gmail.com for fingerlings, feeds and farm
        support.
      </p>
    </noscript>
  </body>
</html>
