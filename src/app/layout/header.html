<header class="bar">
  <div class="container row">
    <a routerLink="/" class="brand" aria-label="Samaki Express home">
      <sx-logo />
    </a>

    <nav class="primary" aria-label="Main">
      <ul role="list">
        @for (item of nav; track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ item.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <div class="tools">
      <sx-theme-toggle />
      <a routerLink="/quote" class="list-link" [attr.aria-label]="'Quote list, ' + list.count() + (list.count() === 1 ? ' item' : ' items')">
        <sx-icon name="list" />
        @if (list.count() > 0) {
          <span class="count" aria-hidden="true">{{ list.count() }}</span>
        }
      </a>
      <a routerLink="/quote" class="btn btn--sm quote-btn" (click)="analytics.track('cta_click', { cta: 'header_quote' })">Request a quote</a>
      <button type="button" class="menu-btn" (click)="menuOpen.set(true)" aria-label="Open menu" [attr.aria-expanded]="menuOpen()">
        <sx-icon name="menu" />
      </button>
    </div>
  </div>
</header>

<p-drawer [visible]="menuOpen()" (visibleChange)="menuOpen.set($event)" position="right" [modal]="true" [blockScroll]="true"
  ariaCloseLabel="Close menu" styleClass="sx-menu" header="Menu">
  <nav aria-label="Mobile">
    <ul role="list" class="m-links">
      <li><a routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a></li>
      @for (item of nav; track item.path) {
        <li><a [routerLink]="item.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{ item.label }}</a></li>
      }
    </ul>
  </nav>
  <div class="m-actions">
    <a routerLink="/quote" class="btn btn--block">Request a quote</a>
    <a class="btn btn--secondary btn--block" [href]="'tel:' + business.phone.tel" (click)="analytics.track('contact_click', { channel: 'phone', page: 'menu' })">
      <sx-icon name="phone" /> Call {{ business.phone.display }}
    </a>
    <p class="small muted">{{ business.hours.display }}</p>
  </div>
</p-drawer>
